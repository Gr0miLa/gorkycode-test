<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Голосовой ассистент</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="shell">
    <header>
      <p class="eyebrow">Задачи и встречи</p>
      <h1>Чем вам помочь?</h1>
      <p class="subtitle">Напишите или продиктуйте задачу естественным языком.</p>
    </header>

    <section id="chat" class="chat" aria-live="polite">
      <article class="message assistant">
        <p>Например: «Добавь встречу с командой завтра в 15:00».</p>
      </article>
    </section>

    <form id="text-form" class="composer">
      <label class="sr-only" for="text-input">Сообщение</label>
      <input id="text-input" name="text" autocomplete="off"
             placeholder="Что запланировать?" maxlength="5000" required>
      <button id="record-button" class="round" type="button" title="Записать голос">●</button>
      <button id="send-button" type="submit">Отправить</button>
    </form>
    <div class="footer-row">
      <span id="status">Готов к работе</span>
      <label><input id="speak-toggle" type="checkbox"> Озвучивать ответы</label>
    </div>
  </main>
  <script src="/static/app.js" defer></script>
</body>
</html>
